services:
  company-db:
    image: postgres:latest
    container_name: company-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - company-db-data:/var/lib/postgresql/data
volumes:
  company-db-data: